<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <script src="../dist/air-css.global.js"></script>
  </head>
  <body>
    <button onclick="aaa()">CLICK</button>
    <div id="sss"></div>
    <div id="html" class="h:20"></div>
    <script>

      function aaa() {

        fetch("test.html")
          .then(response => response.text())
          .then((html) => {
            const air = AirCss.getInstance();
            const g = air.getStaticCss(html);
            document.querySelector('#sss').innerHTML = g;
            // document.querySelector('#html').innerHTML = html;
          });
      }
    </script>
  </body>
</html>
